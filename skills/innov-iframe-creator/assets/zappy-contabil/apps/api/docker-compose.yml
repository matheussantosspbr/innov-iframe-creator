services:
  iframe-name-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.15"
          memory: 256M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:$${APPLICATION_PORT:-3333}/api/health >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
