name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # Só o que mudou roda: packages e arquivos de raiz afetam web e api; apps/<app> afeta só o app.
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'biome.json'
              - '.github/**'
            web:
              - *shared
              - 'apps/web/**'
            api:
              - *shared
              - 'apps/api/**'

  web:
    name: Web (lint, testes, build e docker)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-dependencies
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint
        run: pnpm exec biome check apps/web packages

      - name: Typecheck
        run: pnpm --filter "{./apps/web}..." --if-present run typecheck

      - name: Testes unitários
        run: pnpm --filter "{./apps/web}..." --if-present run test

      - name: Testes e2e
        run: pnpm --filter ./apps/web --if-present run test:e2e

      - name: Build
        run: pnpm --filter ./apps/web --if-present run build

      - name: Preparar .env
        run: |
          for dir in apps/*/; do
            [ -f "${dir}.env.example" ] && cp "${dir}.env.example" "${dir}.env"
          done
          exit 0

      - name: Rede
        run: docker network create app-net

      - name: Docker (build e subida)
        run: |
          docker build -f apps/web/Dockerfile -t iframe-name-web .
          docker run -d --name iframe-name-web --network app-net --env-file apps/web/.env iframe-name-web
          timeout 240 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" iframe-name-web)" = healthy ]; do sleep 3; done'

      - name: Logs do container
        if: failure()
        run: docker logs iframe-name-web

      - name: Derrubar container
        if: always()
        run: docker rm -f iframe-name-web

  api:
    name: API (lint, testes, build e docker)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_TEST_URL: mysql://root:root@127.0.0.1:3306/app_test
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-dependencies
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint
        run: pnpm exec biome check apps/api packages

      - name: Typecheck
        run: pnpm --filter "{./apps/api}..." --if-present run typecheck

      - name: Testes unitários
        run: pnpm --filter "{./apps/api}..." --if-present run test

      - name: Testes e2e
        run: pnpm --filter ./apps/api --if-present run test:e2e

      - name: Build
        run: pnpm --filter ./apps/api --if-present run build

      - name: Preparar .env
        run: |
          for dir in apps/*/; do
            [ -f "${dir}.env.example" ] && cp "${dir}.env.example" "${dir}.env"
          done
          sed -i "s|^APPLICATION_ENCRYPTION_KEY=.*|APPLICATION_ENCRYPTION_KEY=$(openssl rand -base64 32)|; s|^CHATPLATAFORMA_CLIENT_SECRET=.*|CHATPLATAFORMA_CLIENT_SECRET=$(openssl rand -hex 32)|" apps/api/.env

      - name: Infraestrutura (MySQL e rede)
        run: |
          docker network create app-net
          docker run -d --name mysql --network app-net --network-alias mysql \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=app -e MYSQL_USER=app -e MYSQL_PASSWORD=app \
            --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" \
            --health-interval 5s --health-timeout 5s --health-retries 20 mysql:8.4
          until [ "$(docker inspect -f '{{.State.Health.Status}}' mysql)" = healthy ]; do sleep 3; done

      - name: Docker (build e subida)
        run: |
          docker build -f apps/api/Dockerfile -t iframe-name-api .
          docker run -d --name iframe-name-api --network app-net --env-file apps/api/.env \
            -e DATABASE_URL=mysql://app:app@mysql:3306/app -e NODE_ENV=production iframe-name-api
          timeout 240 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" iframe-name-api)" = healthy ]; do sleep 3; done'

      - name: Logs do container
        if: failure()
        run: docker logs iframe-name-api

      - name: Derrubar containers
        if: always()
        run: docker rm -f iframe-name-api mysql

  # Só chega aqui se nada falhou. Com o deploy automático do Coolify (GitHub App) desligado,
  # este é o único gatilho de deploy, e só do que mudou.
  deploy-web:
    name: Deploy web (Coolify)
    needs: [changes, web, api]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - name: Disparar deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_WEB }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

  deploy-api:
    name: Deploy API (Coolify)
    needs: [changes, web, api]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - name: Disparar deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_API }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
