# Só para CI e testes locais: o compose de produção (docker-compose.yml) recebe o env do Coolify.
services:
  iframe-name-api:
    env_file: .env
    environment:
      DATABASE_URL: mysql://app:app@mysql:3306/app
      NODE_ENV: production

networks:
  default:
    name: app-net
    external: true
